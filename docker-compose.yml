services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"

  simulator:
    build:
      context: .
      dockerfile: tools/NetworkSimulator/Dockerfile
    ports:
      - "5099:8080"

  app:
    build:
      context: .
      dockerfile: Presentation/ASPNET/Dockerfile
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
      - simulator
      - seq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=nSuite;User Id=sa;Password=Your_strong_Password123!;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Enabled: "true"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      TelecomIntegrations__Mode: "Http"
      TelecomIntegrations__SimulatorBaseUrl: "http://simulator:8080"
      Serilog__WriteTo__2__Name: "Seq"
      Serilog__WriteTo__2__Args__serverUrl: "http://seq:80"
      Database__UseEfMigrations: "true"
      Database__ApplyLegacyPatchesAfterMigrations: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq:80/ingest/otlp/v1/traces"
      OTEL_SERVICE_NAME: "nsuite-telecom"
    ports:
      - "8080:8080"

volumes:
  sql_data:
