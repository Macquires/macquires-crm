name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Indotalent.sln

      - name: Build
        run: dotnet build Indotalent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Indotalent.sln --configuration Release --no-build --verbosity normal
